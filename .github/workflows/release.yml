name: Release

# tools/release.sh bumps VersionNo.h and pushes the matching tag (v<major>.<minor>.<build>),
# which builds and publishes the release: the setup program (x64) and portable zips (x64, Win32).
# "Run workflow" in the Actions tab builds the same files as workflow artifacts without
# publishing anything (a test of the packaging).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # The projects use the VS 2026 toolset (v145), which only this image has.
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        platform: [Win32, x64]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build\vcpkg-cache
      TRIPLET: ${{ matrix.platform == 'x64' && 'x64-windows-static' || 'x86-windows-static' }}
      ARCH: ${{ matrix.platform == 'x64' && 'x64' || 'win32' }}
      OUT: build\out\${{ matrix.platform }}\Release
    steps:
      - uses: actions/checkout@v7

      # The MSI upgrades by the exe's file version, so the tag must name the version being built.
      - name: Read the version (and check the tag)
        id: version
        shell: pwsh
        run: |
          $h = Get-Content VersionNo.h -Raw
          $v = 'MAJOR_VERSION', 'MINOR_VERSION', 'BUILD_VERSION' | ForEach-Object {
            if ($h -notmatch "#define\s+$_\s+(\d+)") { throw "$_ not found in VersionNo.h" }
            $Matches[1]
          }
          $version = $v -join '.'
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -eq 'tag' -and $tag -ne "v$version") {
            throw "Tag $tag does not match VersionNo.h (v$version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: microsoft/setup-msbuild@v3

      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v6
        with:
          path: build\vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'build/vcpkg.props') }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-

      - name: Fetch BASS
        shell: pwsh
        run: tools\fetch-bass.ps1

      - name: Build
        run: msbuild Jaangle.sln -p:Configuration=Release -p:Platform=${{ matrix.platform }} -m -nologo -v:minimal

      - name: Unit tests
        shell: pwsh
        working-directory: ${{ env.OUT }}
        run: |
          .\UnitTests.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "$LASTEXITCODE test check(s) failed"; exit 1 }

      # Portable: settings and music.db next to the exe (portable.txt marker).
      - name: Package
        shell: pwsh
        run: |
          $name = "Jaangle-${{ steps.version.outputs.version }}-$env:ARCH"
          $stage = "build\release\$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$env:OUT\jaangle.exe", "$env:OUT\bass*.dll", "$env:OUT\portable.txt" $stage
          Copy-Item "$env:OUT\Skins", "$env:OUT\Langs", "$env:OUT\WebServices" $stage -Recurse
          Compress-Archive "$stage\*" "build\release\$name-portable.zip"

      # Burn bundle around the MSI (installer\Setup\JaangleSetup.wixproj builds both).
      - name: Build the setup program
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          msbuild installer\Setup\JaangleSetup.wixproj -restore -p:Configuration=Release -p:Platform=x64 -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build\out\installer\JaangleSetup.exe "build\release\Jaangle-${{ steps.version.outputs.version }}-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.ARCH }}
          path: |
            build\release\*.zip
            build\release\*.exe
          retention-days: 7

      # Symbols for crash dumps of this build; kept with the workflow run, not on the release.
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ env.ARCH }}
          path: ${{ env.OUT }}\jaangle.pdb
          retention-days: 90

  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Jaangle ${GITHUB_REF_NAME#v}" \
            --generate-notes
